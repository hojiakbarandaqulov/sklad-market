server:
  address: 127.0.0.1
  domain: ${SERVER_DOMAIN:https://skladmarket.uz}
  port: ${SERVER_PORT:8091}
  url: ${SWAGGER_SERVER_URL:https://skladmarket.uz}

spring:
  application:
    name: ai-service

  datasource:
    # No password default: a prod boot without AI_DB_PASSWORD (or SPRING_DATASOURCE_PASSWORD, which
    # the compose block supplies) fails fast rather than silently using a guessable literal (§4.2).
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:skalad_market_ai}
    username: ${DB_USERNAME:sklad_user}
    password: ${DB_PASSWORD:sklad-market}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://127.0.0.1:9090/realms/market-realm}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://127.0.0.1:8761/eureka/}
  instance:
    prefer-ip-address: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS:false}
    hostname: ${EUREKA_INSTANCE_HOSTNAME:${spring.application.name}}
    instance-id: ${spring.application.name}:${server.port}

springdoc:
  swagger-ui:
    config-url: /swagger/ai/v3/api-docs/swagger-config
    url: /swagger/ai/v3/api-docs

ai:
  cors:
    # Prod default: only the service's own domain is a permitted CORS origin (localhost patterns are
    # dev-only, added by the local profile's @Value default). Override with a comma-separated list if
    # the deployed SPA is served from a different host. §4.2 prod-hardening.
    allowed-origins: ${AI_CORS_ALLOWED_ORIGINS:}

# Structured (JSON) logging in production only (Spring Boot 3.4 native structured logging — no extra
# dependency). ECS format to the console, which Docker/journald captures. The MDC `requestId` stamped
# by RequestIdFilter is included on every line for request correlation (PLAN.md Phase 7). Local/test
# profiles keep human-readable console logs. Override the format via LOGGING_STRUCTURED_FORMAT_CONSOLE.
logging:
  structured:
    format:
      console: ${LOGGING_STRUCTURED_FORMAT_CONSOLE:ecs}
  level:
    root: INFO
