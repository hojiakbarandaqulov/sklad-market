server:
  domain: http://localhost
  port: 8091

spring:
  application:
    name: ai-service

  datasource:
    url: jdbc:postgresql://localhost:5442/skalad_market_ai
    username: ai_user
    password: ai-market
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/market-realm

eureka:
  client:
    enabled: false
