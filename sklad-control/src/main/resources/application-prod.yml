server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  domain: ${SERVER_DOMAIN:https://skladmarket.uz}
  url: ${SWAGGER_SERVER_URL:https://skladmarket.uz}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:skalad_market_control}
    username: ${DB_USERNAME:sklad_user}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false

springdoc:
  swagger-ui:
    config-url: /swagger/control/v3/api-docs/swagger-config
    url: /swagger/control/v3/api-docs
