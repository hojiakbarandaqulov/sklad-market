server:
  url: ${server.domain}:${server.port}

spring:
  application:
    name: order-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}

  # Jadvallarni Liquibase yaratadi, Hibernate ularning mosligini tekshiradi.
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/master.xml

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 3000
            readTimeout: 8000

# Eureka Client
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://127.0.0.1:8761/eureka/}
  instance:
    prefer-ip-address: true
    ip-address: ${SERVER_IP:127.0.0.1}
    instance-id: ${spring.application.name}:${server.port}

# Buyurtma va servislararo autentifikatsiya
order:
  swagger:
    server-url: ${ORDER_SWAGGER_SERVER_URL:/}
  reservation-ttl: ${ORDER_RESERVATION_TTL:PT24H}
  service-auth:
    token-url: ${ORDER_TOKEN_URL:${KEYCLOAK_TOKEN_URL:http://127.0.0.1:9090/realms/market-realm/protocol/openid-connect/token}}
    client-id: ${ORDER_CLIENT_ID:order-service}
    client-secret: ${ORDER_CLIENT_SECRET:hFJsvoEDED3sxC00Y3sfmSQtZjgvrrvU}

management:
  endpoints:
    web:
      exposure:
        include: health

# Swagger hujjati faqat Order API'larini ko'rsatadi.
springdoc:
  paths-to-match:
    - /api/v1/orders
    - /api/v1/orders/**
  swagger-ui:
    disable-swagger-default-url: true
    tags-sorter: alpha
    operations-sorter: method
