server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  domain: ${SERVER_DOMAIN:http://localhost}
  port: ${SERVER_PORT:8095}

spring:
  application:
    name: order-service

  # DATABASE
  datasource:
    url: ${ORDER_DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:skalad-market-order-db}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:9090/realms/market-realm}

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://127.0.0.1:8761/eureka/}

order:
  service-auth:
    token-url: ${ORDER_TOKEN_URL:${KEYCLOAK_TOKEN_URL:http://localhost:9090/realms/market-realm/protocol/openid-connect/token}}
