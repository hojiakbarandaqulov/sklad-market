server:
  domain: http://localhost
  port: 8095

spring:
  datasource:
    url: jdbc:h2:mem:order-tests;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password:
    driver-class-name: org.h2.Driver
  cloud:
    discovery:
      enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://keycloak.example.test/realms/market-realm
eureka:
  client:
    enabled: false
order:
  recovery:
    enabled: false
