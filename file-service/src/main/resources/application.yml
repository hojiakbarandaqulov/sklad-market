server:
  url: ${server.domain}:${server.port}
spring:
  application:
    name: file-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 8MB


  # Eureka Client
eureka:
  client:
    serviceUrl:
      defaultZone: http://127.0.0.1:8761/eureka/
